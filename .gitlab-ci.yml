###############################################################################
# .gitlab-ci.yml — sba-mint
#
# Migrated from .github/workflows/ (kept as reference: the code is also mirrored
# on github.com, where Actions are passive — GitLab CI is the only CI that runs).
#   jira_check.yml   → jira-check  (validate stage, every MR)
#   pull-request.yml → build       (build stage, MR → release/* | dev/* | develop)
#
# Two runner facts this file depends on — both measured on the instance, not assumed:
#   1. The shared runners expose BOTH docker and shell executors, all accepting
#      untagged jobs. A shell runner ignores `image:` entirely and has no
#      node/npm, so every job must pin `tags: [docker]`. Without it the very
#      first pipeline of this project died on `npm: command not found`.
#   2. Containers reach the internal network directly (gitlab.chapsvision.in) but
#      have NO direct internet access and NO proxy variables of their own.
#      Everything external must go through the Squid proxy — registry.npmjs.org,
#      and npm.sinequa.com which the postinstall pulls @sinequa/assistant from.
#
# Same conventions as sba-atomic-js and sba-atomic-angular, whose pipelines pass.
#
# Changesets (changelog only — see CONTRIBUTING-changesets.md):
#   changeset-check   (validate stage, every MR targeting a release/* branch)
#   changeset-release (release stage, on push to a release/* branch)
#
# Required CI/CD variable (Settings > CI/CD > Variables), same as sba-atomic-js:
#   GITLAB_TOKEN — project/group access token with `api` + `write_repository` scopes,
#                  role >= Developer, flagged masked + protected.
#                  Used by changeset-release to push branches and open MRs via the
#                  GitLab API. The `changeset-release/*` branches must NOT be
#                  protected, otherwise the force-push is rejected.
#
# Enabled on release/11.14.0 only for now (see CONTRIBUTING-changesets.md) — the
# rules below are written against a `release/*` regex, not the literal branch
# name, so a future line (e.g. release/11.15.0) inherits the mechanism as soon as
# it branches off 11.14.0, with no further CI change needed.
###############################################################################

stages:
  - validate
  - build
  - release

# MR events, plus a push to a release/* branch (needed for changeset-release —
# see above). A push pipeline only ever runs the release-stage job: every other
# job keeps its own `merge_request_event`-only rule, so nothing else doubles up.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^release\// && $CI_PIPELINE_SOURCE == "push"

default:
  # node:22 (Debian) ships git and curl — no package install needed, which
  # matters because the Alpine repositories are unreachable from here.
  image: node:22
  # Mandatory: an untagged job can land on a shell runner that ignores `image:`.
  tags: [docker]
  interruptible: true

# ─── templates ───────────────────────────────────────────────────────────────
# `rules:` are deliberately NOT factored: `extends` replaces list keys instead
# of merging them, and each job's conditions differ.

# Access to anything outside the internal network.
.egress:
  variables:
    http_proxy: "http://vip-squid.infra.cloud.prod.dwadm.in:3128"
    https_proxy: "http://vip-squid.infra.cloud.prod.dwadm.in:3128"
    no_proxy: "localhost,127.0.0.1,chapsvision.in,.chapsvision.in"

# Jobs that run `npm ci`, with a lock-file-keyed npm cache. The cache path has
# to live inside $CI_PROJECT_DIR to be cacheable, hence `.npm/` in .gitignore.
.npm:
  extends: .egress
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

# ─── jira-check ──────────────────────────────────────────────────────────────
# Ensures every MR title contains a Jira ticket + #done, or #noJiraCheck.
# Talks to nothing external: no `.egress` needed.
jira-check:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      title="$CI_MERGE_REQUEST_TITLE"
      echo "Checking MR title: $title"
      if echo "$title" | grep -qiE '[A-Za-z]{2,6}-[0-9]+ +#done'; then
        echo "Title contains a Jira ticket with '#done' — OK"
        exit 0
      elif echo "$title" | grep -q '#noJiraCheck'; then
        echo "Check disabled by #noJiraCheck — OK"
        exit 0
      else
        echo "ERROR: Title does not contain a Jira ticket with '#done'."
        echo "       Add '#noJiraCheck' to bypass this check (docs/CI MRs only)."
        exit 1
      fi

# ─── TEMP-debug-token-check ──────────────────────────────────────────────────
# Throwaway diagnostic — never prints the token, only whether it is present
# and API-usable. To be removed before this MR is done.
TEMP-debug-token-check:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      if [ -z "${GITLAB_TOKEN:-}" ]; then
        echo "GITLAB_TOKEN: NOT SET on this project/group."
      else
        code=$(curl -s -o /dev/null -w '%{http_code}' \
          --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID")
        if [ "$code" = "200" ]; then
          echo "GITLAB_TOKEN: set and usable (API returned 200)."
        else
          echo "GITLAB_TOKEN: set but API check failed (HTTP $code)."
        fi
      fi

# ─── changeset-check ─────────────────────────────────────────────────────────
# Verifies that at least one .changeset/*.md file was added in this MR.
# Bypass: add '#skip-changeset' to the MR title, then re-run the MR pipeline
# ("Run pipeline") — GitLab evaluates `rules` at pipeline creation, so editing
# the title does not by itself re-trigger anything and a job retry reuses the
# frozen title. The "version packages" MR is excluded by source branch: it
# legitimately carries no changeset (they were just consumed).
# Scoped to release/11.14.0 only for now — see CONTRIBUTING-changesets.md.
# Talks to gitlab.chapsvision.in only: no `.egress` needed.
changeset-check:
  stage: validate
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/11.14.0" &&
        $CI_MERGE_REQUEST_TITLE !~ /#skip-changeset/ &&
        $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^changeset-release\//
  variables:
    # Full history: the three-dot diff below needs the merge-base.
    GIT_DEPTH: "0"
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - |
      set -eu
      BRANCH="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

      # Explicit refspec: the runner's fetch config does not guarantee that
      # refs/remotes/origin/$BRANCH exists.
      git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"

      # Kept separate from the grep below: a failing `git diff` must abort the
      # job, not be mistaken for "no changeset".
      CHANGED=$(git diff --name-only --diff-filter=A "origin/$BRANCH...HEAD" -- '.changeset/*.md')
      ADDED=$(printf '%s\n' "$CHANGED" | grep -v 'README.md' || true)

      if [ -z "$ADDED" ]; then
        echo "ERROR: No changeset found in this MR."
        echo "       Run 'npx changeset' to create one, or add '#skip-changeset' to the MR title (docs/CI only)."
        exit 1
      fi
      echo "Changeset(s) found:"
      echo "$ADDED"

# ─── build ───────────────────────────────────────────────────────────────────
# Equivalent: .github/workflows/pull-request.yml
# `npm ci` runs the postinstall, which pulls @sinequa/assistant (and @sinequa/agent
# on 11.14.0) from npm.sinequa.com — reachable through the proxy above.
build:
  extends: .npm
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(release\/.*|dev\/.*|develop)$/
  variables:
    CI: "true"
  script:
    - npm ci
    - npm run build

# ─── docs-validate ───────────────────────────────────────────────────────────
# Validation only. This job PUBLISHES NOTHING: no artifact, no `environment`, no
# Pages deployment. Publishing the documentation stays manual and stays on
# github.com — deploy-public.yml and deploy-private.yml, both workflow_dispatch —
# and this file deliberately adds no GitLab equivalent.
#
# Manual and optional: `when: manual` with `allow_failure: true`. It never runs on
# its own and it never blocks a merge request — it appears as a play button, on
# merge requests that touch docusaurus/, for whoever wants the answer.
#
# Why, with the numbers. The public build takes 226s on this runner against 65s on
# a 12-core laptop, for work that is almost pure CPU: webpack compiles client and
# server, then 618 pages are rendered statically, 94 of them containing mermaid,
# for 60MB of output. A shared Docker runner has neither the cores to parallelise
# it nor a distributed cache to skip anything — the trace says
# `No URL provided, cache will not be downloaded from shared cache server`, so the
# npm cache is local to whichever machine picks the job up, and cold is the normal
# case. Four minutes on every merge request that touches a readme is not worth it.
#
# `allow_failure: true` is not optional here, it is the whole point: `when: manual`
# **inside `rules`** defaults `allow_failure` to false, which would leave the
# pipeline blocked on a job nobody started. The default is only true for a
# job-level `when: manual`. Getting this wrong makes the job worse than before.
#
# What this gives up, said plainly. Nothing forced the documentation to be checked
# before this migration either — the GitLab pipeline ignored docusaurus/ entirely,
# which is how the version served at the site root came to be three months behind
# docs/ with nothing reporting it. So the guard moves back to where it was, with
# one difference that matters: it is now cheap to run where it belongs, on the
# author's machine. `npm run check` answers in under a second and needs no build;
# `npm run build` takes about a minute locally. Press the button before merging
# anything structural — a rename, a tombstone, a cut, a sidebar change.
#
# Now that the trees are generated from docusaurus/content/, three things need a
# machine to check them, and each one failed at least once during the migration:
#
#   npm run check    the content diagnostics: a directive pointing at a slug
#                    nothing serves, an inherited sidebar naming a removed doc,
#                    two files claiming one slug. Seconds, and it needs no
#                    generated tree — so it runs first and fails before two
#                    builds have been spent.
#   npm run build    the real proof: onBrokenLinks is 'throw', so a broken
#                    internal link fails here rather than shipping. It
#                    materialises first, through prebuild.
#   npm run verify   LAST, and only there, because what it asserts here is
#                    idempotence: the build has just materialised, so `--check`
#                    must now find nothing to write. Any other count would mean
#                    materialising twice produces two different trees.
#
# One target, not both. The public build is what an external link points at, and
# the internal site is the same content behind a different prefix. Building both
# doubled a ~10 minute job on every merge request to re-verify almost the same
# graph: `onBrokenLinks` validates against the route registry, which does not
# depend on baseUrl, so the second build was really guarding against the two
# configs disagreeing — and they no longer can. Both now derive everything from
# docusaurus.config.base.js and from the materialiser's manifest, and differ only
# in the three values they pass it.
#
# What that accepts, stated rather than hidden: a fault confined to
# docusaurus.internal.config.js — those three keys, or the file failing to load
# at all, which happened twice during the migration under jiti — now surfaces
# when its deploy workflow runs instead of on the merge request. The file is ten
# lines that forward three values, which is what makes the trade reasonable.
#
# The order is the whole point, and the first version of this job had it wrong.
# `verify` is `materialize --check`, which answers "is the tree on disk the one
# content/ implies?". The generated trees are gitignored, so a fresh clone holds
# none of them and the honest answer is "no, all of them" — the job failed with
# `622 would change · 0 unchanged` before anything had had a chance to run.
#
# And worth being explicit about what this job does NOT catch, because the first
# version of this comment claimed it did: a contributor editing the generated
# docs/ instead of content/docs/. That edit cannot reach CI, since docs/ is
# gitignored and never committed. It is caught on the machine that made it, by
# `materialize` printing `edited by hand, overwritten: <path>` on the next build.
# A local guard, and only ever a local one.
#
# Its own cache key: docusaurus/package-lock.json is a separate lockfile from the
# root one, and sharing a key would thrash both caches.
#
# Not extending .npm, because that template keys its cache on the root lockfile.
docs-validate:
  extends: .egress
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docusaurus/**/*
        - .gitlab-ci.yml
      when: manual
      # Required, not decorative: `when: manual` inside `rules` defaults this to
      # false, which blocks the pipeline until someone presses the button.
      allow_failure: true
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - docusaurus/package-lock.json
    paths:
      - .npm/
  script:
    - cd docusaurus
    - npm ci
    - npm run check
    - npm run build
    - npm run verify

# ─── changeset-release ───────────────────────────────────────────────────────
# On push to a release/* branch: if changesets are pending, consumes them into
# CHANGELOG.md and opens/updates a "version packages" MR
# (branch changeset-release/<branch> → <branch>).
#
# Mint is an application, not a published lib — the version is not ours to set
# (`package.json.version` is frozen, owned by product). `changeset version` is
# still run normally (its internal semver engine needs a valid version to bump
# from), but the bump is immediately discarded/restored: only CHANGELOG.md and
# the `.changeset/*.md` removals are kept.
#
# `package.json.buildVersion` (X.Y.Z-N, a valid semver prerelease identifier) is
# this repo's own release counter, entirely separate from `version` — never
# hand-edited, incremented by this job only. Its X.Y.Z prefix always mirrors the
# frozen `version`; if product bumps `version` by hand, the next run here resets
# N to 0. It becomes the CHANGELOG.md section heading, replacing the throwaway
# semver `changeset version` computed.
#
# Enabled on release/11.14.0 only for now — see CONTRIBUTING-changesets.md.
changeset-release:
  extends: .npm
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\// && $CI_PIPELINE_SOURCE == "push"
  # Serialises concurrent runs: two close pushes to the same release branch
  # would otherwise race on the same force-pushed branch.
  # CI_COMMIT_REF_SLUG, not CI_COMMIT_BRANCH: resource_group names reject "/",
  # which every release/* branch contains.
  resource_group: changeset-release-$CI_COMMIT_REF_SLUG
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git config --global user.email "gitlab-ci-bot@users.noreply.gitlab.com"
    - git config --global user.name "gitlab-ci-bot"
    # Depending on the runner version, the job's credentials come either from
    # the remote URL or from this header — which would win over the token in
    # the push URL below. Exit code 5 when absent, hence the `|| true`.
    - git config --unset-all "http.${CI_SERVER_URL}.extraheader" || true
  script:
    - |
      set -eu

      # Usable token? Checked for real (presence AND rights), because a wrong
      # scope or a variable that is not exposed on this ref would otherwise
      # surface as an unreadable git or curl failure further down.
      token_usable() {
        [ -n "${GITLAB_TOKEN:-}" ] || return 1
        code=$(curl -s -o /dev/null -w '%{http_code}' \
          --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID")
        [ "$code" = "200" ]
      }

      token_report() {
        if [ -z "${GITLAB_TOKEN:-}" ]; then
          echo "GITLAB_TOKEN is empty or not exposed on this ref."
          echo "  CI_COMMIT_REF_PROTECTED=${CI_COMMIT_REF_PROTECTED:-unknown} — a 'protected'"
          echo "  variable is only visible on a protected ref."
        else
          echo "GITLAB_TOKEN is set but the API rejected it (see HTTP code above):"
          echo "  missing 'api' scope, insufficient role, or expired token."
        fi
        echo "  Required: project/group access token, scopes api + write_repository, role >= Developer."
      }

      # 1. Any pending changesets? Skip if none. This is also what stops the
      #    loop after the release MR itself is merged.
      if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v 'README.md' || true)" ]; then
        echo "No pending changesets — skipping release MR."
        if token_usable; then
          echo "GITLAB_TOKEN check: OK — a future run will be able to push."
        else
          echo "WARNING: GITLAB_TOKEN check failed — the next run WITH changesets will fail."
          token_report
        fi
        exit 0
      fi

      # 2. From here the token is mandatory.
      if ! token_usable; then
        echo "ERROR: cannot open the release MR."
        token_report
        exit 1
      fi

      # 3. Install deps and figure out the next buildVersion counter.
      npm ci
      git checkout -B "changeset-release/${CI_COMMIT_BRANCH}"

      ORIGINAL_VERSION=$(node -p "require('./package.json').version")
      CURRENT_BUILD_VERSION=$(node -p "require('./package.json').buildVersion || ''")

      # Reset to -0 if the prefix no longer matches the frozen version — e.g.
      # product bumped `version` by hand since the last run.
      case "$CURRENT_BUILD_VERSION" in
        "$ORIGINAL_VERSION"-*)
          LAST_N="${CURRENT_BUILD_VERSION##*-}"
          NEXT_N=$((LAST_N + 1))
          ;;
        *)
          NEXT_N=0
          ;;
      esac
      NEW_BUILD_VERSION="${ORIGINAL_VERSION}-${NEXT_N}"

      # 4. Apply version bumps (into a throwaway semver value — see header note).
      npm run changeset:version

      # 5. Nothing changed after versioning? (e.g. empty changesets)
      if [ -z "$(git status --porcelain)" ]; then
        echo "No changes after 'changeset version' — nothing to commit."
        exit 0
      fi

      # 6. Restore the frozen `version` and stamp the real `buildVersion`.
      #    Regex-replace, not a JSON round-trip: leaves every other field's
      #    formatting untouched.
      node -e "
        const fs = require('fs');
        let content = fs.readFileSync('package.json', 'utf8');
        content = content.replace(/(\"version\": \")[^\"]*(\")/, '\$1${ORIGINAL_VERSION}\$2');
        content = content.replace(/(\"buildVersion\": \")[^\"]*(\")/, '\$1${NEW_BUILD_VERSION}\$2');
        fs.writeFileSync('package.json', content);
      "

      # 7. Retitle the section 'changeset version' just wrote (the first
      #    '## ...' heading — changesets prepends newest at the top) with the
      #    real buildVersion, and append an informational (non-authoritative)
      #    reference to the latest external ES build tag, if any.
      ES_TAG=$(git describe --tags --match "es-${ORIGINAL_VERSION}.*" --abbrev=0 2>/dev/null || true)
      NEW_BUILD_VERSION="$NEW_BUILD_VERSION" ES_TAG="$ES_TAG" node -e "
        const fs = require('fs');
        const newVersion = process.env.NEW_BUILD_VERSION;
        const esTag = process.env.ES_TAG;
        let content = fs.readFileSync('CHANGELOG.md', 'utf8');
        content = content.replace(/^## .*/m, () => {
          let heading = '## ' + newVersion;
          if (esTag) {
            heading += '\n\n_Dernier build ES connu à la génération : ' + esTag + ' (indicatif, non garanti pour ce commit précis)._';
          }
          return heading;
        });
        fs.writeFileSync('CHANGELOG.md', content);
      "

      # 8. Commit + force-push (throwaway branch, resynced on every run).
      #    Pushed through an explicit URL so the token is not written into
      #    .git/config for the whole job.
      git add -A package.json CHANGELOG.md .changeset
      git commit -m "chore: version packages (build ${NEW_BUILD_VERSION})"
      git push --force "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "HEAD:refs/heads/changeset-release/${CI_COMMIT_BRANCH}"

      # 9. Open MR if none is already open; the force-push updates an existing one.
      #    The title includes #noJiraCheck (chore MR, no Jira ticket). No
      #    #skip-changeset needed: changeset-check excludes this source branch.
      MR_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests"
      ENCODED_SOURCE=$(printf '%s' "changeset-release/${CI_COMMIT_BRANCH}" | sed 's#/#%2F#g')
      ENCODED_TARGET=$(printf '%s' "${CI_COMMIT_BRANCH}" | sed 's#/#%2F#g')
      HTTP=$(curl -s -o /tmp/mrs.json -w '%{http_code}' \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "$MR_API?state=opened&source_branch=${ENCODED_SOURCE}&target_branch=${ENCODED_TARGET}")

      # Checked explicitly: an API error body would otherwise look like
      # "no open MR" and send us straight to the creation call.
      if [ "$HTTP" != "200" ]; then
        echo "ERROR: GitLab API returned HTTP $HTTP when listing merge requests."
        cat /tmp/mrs.json
        exit 1
      fi

      if grep -q '"iid"' /tmp/mrs.json; then
        echo "Release MR already open — updated via branch push."
        exit 0
      fi

      HTTP=$(curl -s -o /tmp/mr-create.json -w '%{http_code}' -X POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --header "Content-Type: application/json" \
        "$MR_API" \
        --data "{
          \"source_branch\": \"changeset-release/${CI_COMMIT_BRANCH}\",
          \"target_branch\": \"${CI_COMMIT_BRANCH}\",
          \"title\": \"chore: version packages #noJiraCheck\",
          \"description\": \"MR generated automatically by Changesets.\n\nConsumes pending changesets into CHANGELOG.md (build ${NEW_BUILD_VERSION}). package.json version stays frozen — see CONTRIBUTING-changesets.md.\"
        }")

      case "$HTTP" in
        20*) echo "Release MR created." ;;
        *)
          echo "ERROR: GitLab API returned HTTP $HTTP when creating the merge request."
          cat /tmp/mr-create.json
          exit 1
          ;;
      esac
