###############################################################################
# .gitlab-ci.yml — sba-mint
#
# Migrated from .github/workflows/ (kept as reference: the code is also mirrored
# on github.com, where Actions are passive — GitLab CI is the only CI that runs).
#   jira_check.yml   → jira-check  (validate stage, every MR)
#   pull-request.yml → build       (build stage, MR → release/* | dev/* | develop)
#
# Two runner facts this file depends on — both measured on the instance, not assumed:
#   1. The shared runners expose BOTH docker and shell executors, all accepting
#      untagged jobs. A shell runner ignores `image:` entirely and has no
#      node/npm, so every job must pin `tags: [docker]`. Without it the very
#      first pipeline of this project died on `npm: command not found`.
#   2. Containers reach the internal network directly (gitlab.chapsvision.in) but
#      have NO direct internet access and NO proxy variables of their own.
#      Everything external must go through the Squid proxy — registry.npmjs.org,
#      and npm.sinequa.com which the postinstall pulls @sinequa/assistant from.
#
# Same conventions as sba-atomic-js and sba-atomic-angular, whose pipelines pass.
###############################################################################

stages:
  - validate
  - build

# Both jobs are MR-only, so no pipeline is created on push: that also prevents
# the duplicate pipeline a push matching an open MR would otherwise produce.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  # node:22 (Debian) ships git and curl — no package install needed, which
  # matters because the Alpine repositories are unreachable from here.
  image: node:22
  # Mandatory: an untagged job can land on a shell runner that ignores `image:`.
  tags: [docker]
  interruptible: true

# ─── templates ───────────────────────────────────────────────────────────────
# `rules:` are deliberately NOT factored: `extends` replaces list keys instead
# of merging them, and each job's conditions differ.

# Access to anything outside the internal network.
.egress:
  variables:
    http_proxy: "http://vip-squid.infra.cloud.prod.dwadm.in:3128"
    https_proxy: "http://vip-squid.infra.cloud.prod.dwadm.in:3128"
    no_proxy: "localhost,127.0.0.1,chapsvision.in,.chapsvision.in"

# Jobs that run `npm ci`, with a lock-file-keyed npm cache. The cache path has
# to live inside $CI_PROJECT_DIR to be cacheable, hence `.npm/` in .gitignore.
.npm:
  extends: .egress
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

# ─── jira-check ──────────────────────────────────────────────────────────────
# Ensures every MR title contains a Jira ticket + #done, or #noJiraCheck.
# Talks to nothing external: no `.egress` needed.
jira-check:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      title="$CI_MERGE_REQUEST_TITLE"
      echo "Checking MR title: $title"
      if echo "$title" | grep -qiE '[A-Za-z]{2,6}-[0-9]+ +#done'; then
        echo "Title contains a Jira ticket with '#done' — OK"
        exit 0
      elif echo "$title" | grep -q '#noJiraCheck'; then
        echo "Check disabled by #noJiraCheck — OK"
        exit 0
      else
        echo "ERROR: Title does not contain a Jira ticket with '#done'."
        echo "       Add '#noJiraCheck' to bypass this check (docs/CI MRs only)."
        exit 1
      fi

# ─── build ───────────────────────────────────────────────────────────────────
# Equivalent: .github/workflows/pull-request.yml
# `npm ci` runs the postinstall, which pulls @sinequa/assistant (and @sinequa/agent
# on 11.14.0) from npm.sinequa.com — reachable through the proxy above.
build:
  extends: .npm
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(release\/.*|dev\/.*|develop)$/
  variables:
    CI: "true"
  script:
    - npm ci
    - npm run build

# ─── docs-validate ───────────────────────────────────────────────────────────
# Validation only. This job PUBLISHES NOTHING: no artifact, no `environment`, no
# Pages deployment. Publishing the documentation stays manual and stays on
# github.com — deploy-public.yml and deploy-private.yml, both workflow_dispatch —
# and this file deliberately adds no GitLab equivalent.
#
# What it does is check, on a merge request, what nothing was checking before. The
# site has always been built by those two workflows, but only when someone
# triggered them, and the GitLab pipeline ignored docusaurus/ entirely — which is
# how the version served at the site root came to be three months behind docs/
# with nothing reporting it.
#
# Now that the trees are generated from docusaurus/content/, three things need a
# machine to check them, and each one failed at least once during the migration:
#
#   npm run verify   the generated tree matches the source. Catches the mistake
#                    every Docusaurus contributor makes at least once — editing
#                    the generated docs/ instead of content/docs/ — which would
#                    otherwise vanish at the next build with no trace.
#   npm run check    the content diagnostics: a directive pointing at a slug
#                    nothing serves, an inherited sidebar naming a removed doc,
#                    two files claiming one slug.
#   both builds      onBrokenLinks is 'throw', and the two deployment targets
#                    have different baseUrl values, so a link can break in one
#                    and not in the other.
#
# Its own cache key: docusaurus/package-lock.json is a separate lockfile from the
# root one, and sharing a key would thrash both caches.
#
# Not extending .npm, because that template keys its cache on the root lockfile.
docs-validate:
  extends: .egress
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docusaurus/**/*
        - .gitlab-ci.yml
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - docusaurus/package-lock.json
    paths:
      - .npm/
  script:
    - cd docusaurus
    - npm ci
    - npm run verify
    - npm run check
    - npm run build
    - npm run build-internal
