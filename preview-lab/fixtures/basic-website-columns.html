         This is a layout mode the synthetic two-columns fixture cannot reproduce: there,
         each line is an absolutely positioned div, so the columns are separate subtrees.
         Here the browser breaks a single inline flow across columns, so the fragments of
         a passage crossing a column break share the same body-level ancestor and only
         the geometry -- the column gap -- can tell the columns apart. -->
    <script>
      LAB.writeContent("_silicon-valley.html");
      LAB.columnize({ count: 3 });

        title: "Real Sinequa dump — flowed into 3 CSS columns",
