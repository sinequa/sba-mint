<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — frameset document</title>
    <script>
      // Declared on the outer document, where preview.js runs, so the lab always
      // finds the expectation in the same place.
      window.LAB_EXPECT = {
        title: "Frameset document (content in a nested frame)",
        frameset: true,
        passages: {
          snippet_1: { blocks: 1, label: "passage inside the frame" }
        }
      };
    </script>
    <!-- preview.js lives in the outer document and resolves the content body
         through `document.querySelector("frameset>frame").contentDocument.body`,
         exactly as in production. -->
    <script src="../../src/assets/preview.js"></script>
  </head>
  <frameset rows="100%">
    <frame src="frameset-inner.html" name="content" />
  </frameset>
</html>
