<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — multimodal AI description (hidden by default)</title>
    <link rel="stylesheet" href="../../src/assets/preview.css" />
    <link rel="stylesheet" href="_fixture.css" />
  </head>
  <body>
    <script src="_fixture.js"></script>
    <script>
      // Reproduces the c_PdfAdvancedMultimodal shape reported in ES-29767: the
      // LLM-generated full text describing a visual is emitted as a
      // `.pn_page_visual_description` block, which preview.css hides by default
      // (`:root { --desc-display: none }`). A citation pointing at that text
      // therefore targets spans inside a `display: none` subtree: zero-sized
      // rects, scrollIntoView() no-op, no frame.
      (function () {
        function page(number, withImage) {
          var sheet = document.createElement("div");
          sheet.className = "stl_";

          var anchor = document.createElement("a");
          anchor.id = "sq-page-start-" + number;
          sheet.appendChild(anchor);

          var title = document.createElement("div");
          title.className = "t";
          title.style.top = "64px";
          title.style.left = "60px";
          title.setAttribute("data-lab-decoy", "line");
          title.textContent = "Slide " + number + " — " + LAB.words(5);
          sheet.appendChild(title);

          if (withImage) {
            var frame = document.createElement("div");
            frame.className = "t lab-image-page";
            frame.style.top = "110px";
            frame.style.left = "0";
            frame.setAttribute("data-lab-decoy", "image");
            frame.appendChild(document.createElement("img"));
            sheet.appendChild(frame);
          }

          for (var row = 0; row < 8; row++) {
            var line = document.createElement("div");
            line.className = "t";
            line.style.top = 560 + row * 24 + "px";
            line.style.left = "60px";
            line.setAttribute("data-lab-decoy", "line");
            line.textContent = LAB.words(14);
            sheet.appendChild(line);
          }

          var footer = document.createElement("div");
          footer.className = "pageno";
          footer.setAttribute("data-lab-decoy", "footer");
          footer.textContent = "- " + number + " -";
          sheet.appendChild(footer);

          return sheet;
        }

        document.body.appendChild(page(1, true));

        // The generated description is appended after the page it describes,
        // as a body-level block: showing it shifts everything below, which also
        // exercises the "reposition after a layout change" path.
        var description = document.createElement("div");
        description.className = "lab-flow customfulltext pn_page_visual_description";
        var lead = document.createElement("span");
        lead.textContent = LAB.words(4) + " ";
        description.appendChild(lead);
        var span = document.createElement("span");
        span.id = "snippet_1";
        span.textContent = LAB.words(60);
        description.appendChild(span);
        document.body.appendChild(description);

        document.body.appendChild(page(2, false));

        LAB.pagination(2, 1);

        window.LAB_EXPECT = {
          title: "Multimodal AI description, hidden by default",
          passages: {
            snippet_1: { blocks: 1, label: "generated description (hidden)", hidden: true }
          }
        };
      })();
    </script>
    <script src="../../src/assets/preview.js"></script>
  </body>
</html>
