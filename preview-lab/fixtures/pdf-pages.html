<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — 6 pages, single column</title>
    <!-- The files under test, loaded from src/ without any copy. -->
    <link rel="stylesheet" href="../../src/assets/preview.css" />
    <link rel="stylesheet" href="_fixture.css" />
  </head>
  <!-- No `bd` class on purpose: `body.bd > div` in preview.css would override
       `content-visibility: auto` on the page sheets, and the off-screen-page
       measurement problem would disappear from the fixture. -->
  <body>
    <script src="_fixture.js"></script>
    <script>
      window.LAB_EXPECT = LAB.buildPdfPages({
        title: "6 pages, single column",
        pages: 6,
        columns: 1,
        rowsPerColumn: 34,
        snippets: [
          // Near the top of the document: the case that already worked.
          { id: "snippet_1", label: "page 1, 4 lines", placements: [{ page: 1, slots: [5, 6, 7, 8] }] },
          // Far from the initial scroll position, on the last page: the case the
          // customer reports as failing ("does not include the end of the file").
          { id: "snippet_2", label: "last page, 4 lines", placements: [{ page: 6, slots: [10, 11, 12, 13] }] }
        ]
      });
    </script>
    <script src="../../src/assets/preview.js"></script>
  </body>
</html>
