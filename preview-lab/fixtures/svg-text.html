<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — SVG text preview</title>
    <link rel="stylesheet" href="../../src/assets/preview.css" />
    <link rel="stylesheet" href="_fixture.css" />
  </head>
  <body>
    <script src="_fixture.js"></script>
    <script>
      // Some converters emit SVG text. `.sq-highlighted { background-color }`
      // has no effect on SVG text (it has no background box), so the current
      // shipped behaviour shows nothing at all here.
      (function () {
        var SVG_NS = "http://www.w3.org/2000/svg";
        var svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("width", "816");
        svg.setAttribute("height", "700");
        svg.setAttribute("viewBox", "0 0 816 700");
        svg.style.background = "#fff";
        svg.style.border = "1px solid lightgrey";
        svg.style.margin = "24px";

        var group = document.createElementNS(SVG_NS, "g");
        svg.appendChild(group);

        // Entity background rect, resized at startup by setSvgBackgroundPositionAndSize().
        var rect = document.createElementNS(SVG_NS, "rect");
        rect.setAttribute("id", "bg_entity_1");
        rect.setAttribute("class", "sinequaSVGBg");
        group.appendChild(rect);

        function textLine(y, content, options) {
          var text = document.createElementNS(SVG_NS, "text");
          text.setAttribute("x", "60");
          text.setAttribute("y", String(y));
          text.setAttribute("font-size", "13");
          text.setAttribute("font-family", "Times New Roman, serif");

          var tspan = document.createElementNS(SVG_NS, "tspan");
          tspan.textContent = content;
          if (options && options.id) tspan.setAttribute("id", options.id);
          if (options && options.entity) {
            tspan.setAttribute("id", "entity_1");
            tspan.setAttribute("data-entity-background", "bg_entity_1");
            tspan.setAttribute("data-entity-display", "Entity");
          }
          text.appendChild(tspan);
          if (options && options.decoy) text.setAttribute("data-lab-decoy", "svg-line");
          group.appendChild(text);
        }

        textLine(60, LAB.words(12), { decoy: true });
        textLine(84, LAB.words(12), { decoy: true });
        textLine(108, LAB.words(6), { entity: true });
        textLine(132, LAB.words(12), { decoy: true });
        // Three consecutive lines of the passage -> a single frame.
        textLine(156, LAB.words(11), { id: "snippet_1" });
        textLine(180, LAB.words(11), { id: "snippet_1" });
        textLine(204, LAB.words(11), { id: "snippet_1" });
        for (var y = 228; y <= 660; y += 24) {
          textLine(y, LAB.words(12), { decoy: true });
        }

        document.body.appendChild(svg);
        LAB.pagination(1, 1);

        window.LAB_EXPECT = {
          title: "SVG text preview",
          passages: {
            snippet_1: { blocks: 1, label: "3 SVG text lines" }
          }
        };
      })();
    </script>
    <script src="../../src/assets/preview.js"></script>
  </body>
</html>
