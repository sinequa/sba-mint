@if (authenticated()) {
  <sidebar class="peer fixed top-0 h-full">
    <sidebar-separator />
    <div class="grow">
      <sidebar-item title="Document search" [attr.aria-label]="'Document search'" routerLink="/home">
        <i class="far fa-magnifying-glass"></i>
        <span>Search</span>
      </sidebar-item>
      @if (allowAI()) {
        <sidebar-item title="Chats" [attr.aria-label]="'Chats'" routerLink="/assistant">
          <i class="far fa-comment"></i>
          <span>Chats</span>
        </sidebar-item>
      }
    </div>
    @if (isAdmin()) {
      <sidebar-item title="Administration" [attr.aria-label]="'Administration'" (click)="openAdmin()">
        <i class="fas fa-gear"></i>
        <span>Administration</span>
      </sidebar-item>
    }
    <sidebar-item title="Help" [attr.aria-label]="'Help'" (click)="openHelp()">
      <i class="far fa-question-circle"></i>
      <span>Help</span>
    </sidebar-item>
  </sidebar>
}

<!-- Only the assistant layout's content slide when the slidebar is open -->
<div class="h-full transition-all duration-150 ease-in-out peer-[[data-open='true']]:has-[assistant-layout]:ml-18">
  <!-- Main content goes here -->
  <router-outlet></router-outlet>
</div>

<app-backdrop />

<app-drawer-stack />

<ngx-sonner-toaster richColors expand visibleToasts="10" />
