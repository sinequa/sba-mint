<router-outlet></router-outlet>

<MultiSelectionToolbar class="z-[var(--z-multiselection)]" (updatedCollections)="onUpdatedCollections()" />

<Backdrop />
<DrawerStack />

<ngx-sonner-toaster
  expand
  visibleToasts="10"
  [toastOptions]="{
    unstyled: true,
    classes: {
      toast: 'min-w-80 w-80 flex gap-1 items-center shadow-md rounded-md p-4',
      success: 'bg-success text-success-foreground',
      error: 'bg-red-400 text-red-600',
      info: 'bg-info text-info-foreground',
      warning: 'bg-warning text-warning-foreground'
    }
  }" />
