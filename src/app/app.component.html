<div class="flex h-full">
  <sidebar class="fixed top-0 h-full translate-0 transition duration-200 ease-in-out">
    <sidebar-separator />
    <div class="grow">
      <sidebar-item title="Document search" [attr.aria-label]="'Document search'" routerLink="/home">
        <i class="far fa-folders"></i>
        <span>Document search</span>
      </sidebar-item>
      @if (allowAI()) {
        <sidebar-item title="Chats" [attr.aria-label]="'Chats'" routerLink="/assistant">
          <i class="far fa-comment"></i>
          <span>Chats</span>
        </sidebar-item>
      }
    </div>
    <sidebar-item title="Help" [attr.aria-label]="'Help'" (click)="openHelp()">
      <i class="fal fa-question-circle"></i>
      <span>Help</span>
    </sidebar-item>
  </sidebar>

  <div class="flex-1">
    <!-- Main content goes here -->
    <router-outlet></router-outlet>
  </div>
</div>

<app-backdrop />

<app-drawer-stack />

<ngx-sonner-toaster richColors expand visibleToasts="10" />
