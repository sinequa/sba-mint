<article class="group/article article p-0" [class.selected]="selected()">
  <section class="shrink-0">
    @if (article().thumbnailUrl && !thumbnailFailed()) {
      <div class="ratio-video flex h-full w-[120px] rounded-s-lg bg-gray-100 object-cover">
        <img class="ratio-video h-full rounded-s-lg object-cover" [src]="article().thumbnailUrl" (error)="thumbnailFailed.set(true)" [alt]="article().title" />
      </div>
    }
  </section>

  <section class="flex flex-col gap-2 p-4">
    <header>
      <div class="flex items-baseline gap-2 overflow-auto">
        <p class="text-primary line-clamp-1 text-base font-bold">{{ article().title }}</p>

        @if (showBookmark()) {
          <bookmark-button [article]="article()" />
        }
      </div>

      <section class="flex items-center gap-1">
        <div class="divide-x-slash divide-xs flex gap-1 divide-gray-200">
          @if ((article().authors || { authors: [''] }).length > 0) {
            <p class="flex items-baseline gap-1">
              <i class="fa-fw far fa-user"></i>
              {{ article().authors[0] }}
            </p>
          }

          @if (article().modified) {
            <p class="flex items-baseline gap-1">
              <i class="fa-fw far fa-calendar-day"></i>
              <span class="w-max">{{ article()!.modified!.split(' ')[0] | translocoDate: 'mediumDate' }}</span>
            </p>
          }
        </div>
      </section>
    </header>
  </section>
</article>
