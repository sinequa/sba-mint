<dialog #dialog class="mx-[1vw] my-[1vh] h-[98vh] max-h-[98vh] w-[98vw] max-w-[97vw]" (closed)="article.set(undefined)">
  <DialogHeader>
    <DialogTitle>{{ this.article()?.title }}</DialogTitle>
  </DialogHeader>

  <DialogContent class="flex grow gap-4 overflow-auto">
    @if (article()) {
      <preview-content class="h-full w-2/3" [previewData]="previewData()!" />
      <div class="flex w-1/3 flex-col">
        <Tabs class="px-6" variant="ghost">
          <Tab class="w-fit" shadow="none" value="previewTab-preview" [active]="activeTab() === 'chat'" (click)="activeTab.set('chat')">
            {{ 'previewDialog.chat' | transloco }}
          </Tab>
          <Tab class="w-fit" shadow="none" value="previewTab-preview" [active]="activeTab() === 'summary'" (click)="activeTab.set('summary')">
            {{ 'previewDialog.summary' | transloco }}
          </Tab>
          <Tab class="w-fit" shadow="none" value="previewTab-preview" [active]="activeTab() === 'find'" (click)="activeTab.set('find')">
            {{ 'previewDialog.find' | transloco }}
          </Tab>
        </Tabs>
        <div class="grow">
          <assistant
            [hidden]="activeTab() !== 'chat'"
            [instanceId]="chatWithDocIntanceId()"
            [query]="chatWithDocQuery"
            [showAssistant]="true"
            class="h-full w-full" />
          <assistant
            [hidden]="activeTab() !== 'summary'"
            [instanceId]="summarizeInstanceId()"
            [query]="miniPreviewQuery"
            [showAssistant]="true"
            class="h-full w-full" />
          <advanced-search
            [hidden]="activeTab() !== 'find'"
            class="bg-menu border-foreground/18 h-full w-full overflow-y-auto border-l [&>div>section]:mt-0"
            [article]="article()!"
            [previewStrategy]="'redirect'" />
        </div>
      </div>
    }
  </DialogContent>
</dialog>
