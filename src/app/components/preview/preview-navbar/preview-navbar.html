@if (drawerPreviewRef) {
  <DrawerNavbar>
    <ng-container *ngTemplateOutlet="actions"></ng-container>
  </DrawerNavbar>
} @else {
  <nav class="flex gap-2 p-2">
    <button
      variant="ghost"
      class="group inline-flex h-8 cursor-pointer items-center justify-center gap-1.5 rounded-lg bg-transparent px-3 py-0 text-sm font-medium whitespace-nowrap text-foreground hover:bg-foreground/10 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:outline-none disabled:pointer-events-none disabled:text-muted-foreground [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0"
      title="Back"
      (click)="location.historyGo(backLevel)">
      <span class="opacity-60 group-hover:-translate-x-0.5">
        <svg
          class="svg-inline--fa fa-arrow-left fa-fw"
          aria-hidden="true"
          focusable="false"
          data-prefix="far"
          data-icon="arrow-left"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 448 512"
          data-fa-i2svg="">
          <path
            fill="currentColor"
            d="M7.4 273.4C2.7 268.8 0 262.6 0 256s2.7-12.8 7.4-17.4l176-168c9.6-9.2 24.8-8.8 33.9 .8s8.8 24.8-.8 33.9L83.9 232 424 232c13.3 0 24 10.7 24 24s-10.7 24-24 24L83.9 280 216.6 406.6c9.6 9.2 9.9 24.3 .8 33.9s-24.3 9.9-33.9 .8l-176-168z"></path></svg
      ></span>
      {{ 'back' | transloco }}
    </button>
    <ng-container *ngTemplateOutlet="actions"></ng-container>
  </nav>
}

<ng-template #actions>
  @if (navConfig.showOpenButton) {
    <button variant="ghost" [attr.title]="'open' | transloco" [disabled]="!isExternalLinkValid()" (click)="openClicked()">
      <i class="fa-fw far fa-arrow-up-right-from-square"></i>
      {{ 'open' | transloco }}
    </button>

    <Separator orientation="vertical" />
  }

  @if (expandPreview()) {
    <button variant="ghost" [attr.title]="'expand' | transloco" (click)="onExpand()">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256">
        <path
          d="M216,48V96a8,8,0,0,1-16,0V67.31l-50.34,50.35a8,8,0,0,1-11.32-11.32L188.69,56H160a8,8,0,0,1,0-16h48A8,8,0,0,1,216,48ZM106.34,138.34,56,188.69V160a8,8,0,0,0-16,0v48a8,8,0,0,0,8,8H96a8,8,0,0,0,0-16H67.31l50.35-50.34a8,8,0,0,0-11.32-11.32Z"></path>
      </svg>
      {{ 'previewDialog.expand' | transloco }}
    </button>

    <Separator orientation="vertical" />
  }

  @if (canBookmark()) {
    <button variant="ghost" size="icon" [attr.title]="'bookmark.bookmarkDocument' | transloco">
      <bookmark-button [article]="article()!" />
    </button>
  }

  @if (isExternalLinkValid()) {
    <button variant="ghost" size="icon" [attr.title]="'preview.copyPreviewLink' | transloco" (click)="copyLink()">
      @if (copied()) {
        <circle-check class="size-4" />
      } @else {
        <link-icon class="size-4" />
      }
    </button>
  }

  @if (navConfig.showSearchButton && article()) {
    <div class="ml-auto *:flex *:items-center *:gap-2 *:text-nowrap">
      @if (extended()) {
        <button variant="outline" (click)="toggle()">
          <i class="fa-fw far fa-eye-slash"></i>
          {{ 'preview.hideSearch' | transloco }}
        </button>
      } @else {
        <button variant="outline" (click)="toggle()">
          <i class="fa-fw far fa-eye"></i>
          {{ 'preview.searchInDocument' | transloco }}
        </button>
      }
    </div>
  }
</ng-template>

<preview-dialog />
