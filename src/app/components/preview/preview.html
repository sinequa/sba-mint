<div class="flex max-w-[inherit] flex-col overflow-hidden">
  <preview-navbar class="border-muted-foreground/18 block border-b" [(extended)]="extended" [article]="article()" />

  <div class="relative mb-2 flex h-full flex-col gap-0.5">
    @if (article()) {
      <section class="border-muted-foreground/18 relative border-b px-6 py-4">
        <preview-header [article]="article()" />
        <section class="absolute bottom-0 left-0 w-full overflow-hidden" [class.invisible]="!loading()">
          <div class="animate-progress from-ai-from via-ai-via to-ai-to h-[2px] bg-linear-to-r"></div>
        </section>
      </section>

      <!-- Tab Navigation only if the "display summary is available " -->
      <preview-tabs class="contents" />
    }
  </div>
</div>

<advanced-search class="bg-menu border-foreground/18 h-full w-full overflow-y-auto border-l" [article]="article()" [previewStrategy]="'redirect'" />
