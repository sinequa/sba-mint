<sidebar class="w-fit">
  <div class="mt-30 grow">
    @if (backLevel()) {
      <sidebar-item title="Search" [attr.aria-label]="'Search'" (click)="location.historyGo(backLevel())">
        <i class="fa-fw far fa-magnifying-glass"></i>
      </sidebar-item>
    } @else {
      <sidebar-item title="Search" [attr.aria-label]="'Search'" routerLink="/home">
        <i class="fa-fw far fa-magnifying-glass"></i>
      </sidebar-item>
    }

    <sidebar-item [class]="cn('invisible', allowAI() && 'visible')" title="Chats" [attr.aria-label]="'Chats'" routerLink="/assistant">
      <i class="fa-fw far fa-comment"></i>
    </sidebar-item>

    <ng-content></ng-content>
  </div>

  @if (isAdmin()) {
    <sidebar-item title="Administration" [attr.aria-label]="'Administration'" (click)="openAdmin()">
      <i class="fa-fw far fa-gear"></i>
    </sidebar-item>
  }

  <sidebar-item title="Help" [attr.aria-label]="'Help'" (click)="openHelp()">
    <i class="fa-fw far fa-question-circle"></i>
  </sidebar-item>
</sidebar>
