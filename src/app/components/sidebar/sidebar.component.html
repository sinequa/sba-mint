<sidebar class="peer absolute top-0 h-full">
  <div class="grow">
    <sidebar-item title="Search" [attr.aria-label]="'Search'" [routerLink]="searchRoute() === 'home' ? '/home' : undefined" (click)="onSearchClick()">
      <i class="far fa-magnifying-glass"></i>
    </sidebar-item>
    <sidebar-item [class]="cn('invisible', allowAI() && 'visible')" title="Chats" [attr.aria-label]="'Chats'" routerLink="/assistant">
      <i class="far fa-comment"></i>
    </sidebar-item>
    <ng-content></ng-content>
  </div>
  @if (isAdmin()) {
    <sidebar-item title="Administration" [attr.aria-label]="'Administration'" (click)="openAdmin()">
      <i class="fas fa-gear"></i>
    </sidebar-item>
  }
  <sidebar-item title="Help" [attr.aria-label]="'Help'" (click)="openHelp()">
    <i class="far fa-question-circle"></i>
  </sidebar-item>
</sidebar>
