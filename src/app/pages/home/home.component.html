<app-user-menu class="absolute right-0 mt-4 pr-10" />
<div class="col-span-2 col-start-2">
  <header class="flex h-1/3">
    <img class="mx-auto mb-16 mt-auto w-64" src="assets/logo/large.svg" alt="Sinequa logo" />
  </header>

  <main class="flex h-[50vh] flex-col gap-16">
    <app-search-input class="h-7 w-full" (debounced)="searchText.set($event)" (validated)="search($event)">
      <app-autocomplete [text]="searchText()" (onClick)="autocompleteItemClicked($event)" />
    </app-search-input>

    <div class="flex max-h-full grow flex-col">
      <menu class="flex font-semibold">
        @for (tab of tabs(); track tab.label) {
          <li>
            <button
              class="tab aria-selected:border-primary aria-selected:text-primary"
              [attr.disabled]="tab.disabled ?? null"
              [attr.tabindex]="tab.disabled ? -1 : 0"
              [attr.aria-selected]="selectedTabId() === $index"
              (click)="selectTab(tab)"
              (keydown.enter)="selectTab(tab)">
              <i class="fa-fw {{ tab.iconClass }}"></i>
              {{ tab.label }}
            </button>
          </li>
        }

        <li class="grow border-b border-neutral-300"></li>
      </menu>

      <div class="scrollbar-thin my-8 overflow-y-auto">
        @for (tab of tabs(); track tab.label) {
          <div [ngClass]="{ hidden: selectedTabId() !== $index }">
            <ng-container *ngComponentOutlet="tab.component" />
          </div>
        }
      </div>

      <hr class="border-neutral-300" />
    </div>
  </main>
</div>
