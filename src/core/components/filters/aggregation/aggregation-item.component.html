<a
  role="listitem"
  [attr.aria-selected]="node().$selected"
  [attr.aria-label]="name() | syslang"
  [style.--level]="(node().$level ?? 0) - 1 + (!node().hasChildren ? 1 : 0)"
  [class]="
    cn(
      'flex grow items-center gap-2 p-1 leading-7',
      node().count === 0 && 'disabled pointer-events-none text-neutral-300',
      node().$selected && 'bg-primary-100 text-primary'
    )
  "
  (click)="select($event, node())">
  <button (click)="open($event, node())" class="transition-transform ease-in hover:scale-125">
    <!-- <i class="fas fa-angle-right"></i> -->
    <svg
      [class]="cn('size-4 translate-x-1', node().$opened && 'rotate-90', !node().hasChildren && 'hidden')"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="m9 18 6-6-6-6" />
    </svg>
  </button>

  <input
    type="checkbox"
    role="checkbox"
    value="{{ node().value }}"
    [attr.disabled]="node().count === 0 ? true : null"
    [attr.aria-disabled]="node().count === 0"
    (keydown.enter)="select($event, node())"
    [checked]="node().$selected" />

  @if (node().icon) {
    <i class="fa-fw {{ node().icon }} self-center justify-self-center" aria-hidden="true"></i>
  }

  <span class="line-clamp-1 text-ellipsis" [title]="name() | syslang">{{ name() | syslang }}</span>
</a>

@if (node().hasChildren && node().$opened) {
  @for (item of node().items; track $index) {
    <AggregationItem [node]="item" (onOpen)="onOpen.emit($event)" (onSelect)="onSelect.emit($event)" />
  }
}
