<div
  id="autocomplete-anchor"
  class="group relative flex h-8 grow rounded focus-within:z-[1001] focus-within:rounded-b-none focus-within:outline-primary hover:outline hover:outline-1 [&:not(:focus-within)]:hover:outline-neutral-300">
  <div class="flex grow items-center gap-2 rounded-s bg-neutral-50 pl-2 focus-within:rounded-b-none group-hover:bg-white">
    @if (showSave() && input() !== '') {
      <button
        variant="icon"
        size="icon"
        class="w-4"
        [ngClass]="{ 'animate-save': saveAnimation() }"
        [attr.title]="'searchInput.saveSearch' | transloco"
        [attr.aria-label]="'searchInput.saveSearch' | transloco"
        (click)="saveQuery()"
        (keydown.enter)="saveQuery()">
        @if (isSavedSearch()) {
          <i class="fa-fw fas fa-star" aria-hidden="true"></i>
        } @else {
          <i class="fa-fw far fa-star" aria-hidden="true"></i>
        }
      </button>
    }

    <input
      type="search"
      id="search-navbar"
      class="grow bg-neutral-50 focus:outline-none group-hover:bg-white"
      [attr.placeholder]="'searchInput.placeholder' | transloco"
      [attr.aria-label]="'searchInput.placeholder' | transloco"
      autocomplete="off"
      spellcheck="false"
      [ngModel]="input()"
      (ngModelChange)="input.set($event)"
      (keyup)="onKeyDown($event)"
      (click)="inputClicked()"
      aria-keyshortcuts="/" />

    <!-- Clear search button -->
    @if (input() !== '') {
      <button
        variant="icon"
        size="icon"
        [attr.title]="'searchInput.clearSearch' | transloco"
        [attr.aria-label]="'searchInput.clearSearch' | transloco"
        (click)="clearInput($event)"
        (keydown.enter)="clearInput($event)">
        <i class="fa-fw far fa-circle-xmark" aria-hidden="true"></i>
      </button>
    }

    <!-- Ask AI button -->
    @if (input() !== '' && allowChatDrawer()) {
      <button
        class="btn btn-xs my-1 rounded-sm bg-blue-100 text-sm text-primary"
        title="Ask AI"
        aria-label="Ask AI"
        (click)="askAI()"
        (keydown.enter)="askAI()">
        <i class="fa-fw fa-regular fa-sparkles me-1" aria-hidden="true"></i>
        Ask AI
      </button>
    }
  </div>

  <!-- Search button -->
  <button
    class="size-4 h-full rounded-e rounded-s-none group-focus-within:rounded-br-none"
    [attr.title]="'search' | transloco"
    [attr.aria-label]="'search' | transloco"
    [attr.aria-disabled]="!allowEmptySearch() && this.input() === ''"
    [disabled]="!allowEmptySearch() && this.input() === ''"
    (click)="emitText()">
    <i class="fa-fw far fa-magnifying-glass" aria-hidden="true"></i>
  </button>
</div>

<div popover #autocompletePopover>
  <ng-content></ng-content>
</div>
