@if (sponsoredResults()?.length) {
  @for (link of sponsoredResults(); track $index) {
    <a
      href="{{ link.url }}"
      target="_blank"
      title="{{ link.tooltip || link.title }}"
      class="result-link flex items-center gap-2 rounded px-3 py-2 font-bold text-primary hover:underline">
      <i class="fa-fw far fa-arrow-up-right-from-square"></i>
      <span>{{ link.title }}</span>
      <span class="promoted-badge flex items-center rounded-xl bg-primary px-2 text-xs text-white">PROMOTED</span>
    </a>
  }
}
