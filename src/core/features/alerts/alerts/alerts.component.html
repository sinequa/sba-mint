<ul class="flex flex-col" cdkDropList [cdkDropListData]="tmpAlerts" [cdkDropListDisabled]="!reordering()" (cdkDropListDropped)="dropped($event)">
  @for (alert of tmpAlerts; track $index) {
    <li
      class="group flex h-10 cursor-pointer items-center gap-2 rounded px-3 py-2 hover:bg-secondary hover:text-primary focus:bg-secondary focus:text-primary focus:outline-none"
      tabindex="0"
      cdkDrag
      (click)="onClick($index)"
      (keydown.enter)="onClick($index)">
      <span class="grow">
        {{ alert.name }}
      </span>
      @if (!reordering()) {
        <i class="fa-fw fa-regular fa-trash-can" (click)="deleteAlert($event, $index)"></i>
      } @else {
        <i class="fa-fw fa-regular fa-bars"></i>
      }
    </li>
  } @empty {
    <li class="py-4 text-center text-neutral-500">
      {{ 'alert.noAlerts' | transloco }}
    </li>
  }
  <li class="flex flex-row-reverse gap-2 py-4 text-center text-neutral-500">
    <button
      class="btn btn-tertiary flex justify-center px-3 py-2"
      tabindex="0"
      [attr.title]="'alert.manageAlerts' | transloco"
      [disabled]="!alerts().length"
      (click)="reorder()">
      {{ (reordering() ? 'save' : 'alert.manageAlerts') | transloco }}
    </button>
    <button class="btn btn-tertiary flex justify-center px-3 py-2" tabindex="1" [attr.title]="'alert.createAlert' | transloco" (click)="createAlert()">
      {{ 'alert.createAlert' | transloco }}
    </button>
  </li>
</ul>

<alert-form-dialog />
